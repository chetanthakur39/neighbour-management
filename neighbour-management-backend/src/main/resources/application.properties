spring.application.name=neighbour-management-backend

# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/neighbour_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server
# ===============================

server.port=${PORT:8080}


# Allowed browser origin for the automation API
